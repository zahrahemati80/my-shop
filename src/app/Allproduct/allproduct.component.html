      <div class="container">
        @if (loading()) {
          <p>در حال بارگذاری...</p>
        } @else if (error()) {
          <p class="error">{{ error() }}</p>
        } @else {
          <div class="grid">
            @for (product of products(); track product.id) {
              <div class="card m-3 bg-amber-200">
               <img [src]="product.image" [alt]="product.title" />
                <h3>{{ product.title }}</h3>
                <p class="price">{{ product.price  }}$</p>
                <p class="desc">{{ product.description }}</p>
              </div>
            } @empty {
              <p>محصولی یافت نشد.</p>
            }
          </div>
        }
      </div>
    </div>
