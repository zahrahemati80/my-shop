<form (submit)='onSubmit($event)' >
  <label>نام:<input type='text' [formField]='signupForm.name'></label>
  <label>نام خانوادگی:<input type='text' [formField]='signupForm.lastname'></label>
  <label>ایمیل:<input type='email' [formField]='signupForm.email'></label>
  <label>پسورد:<input type='password' [formField]='signupForm.password'></label>
  <label>کدملی:<input type='number' [formField]='signupForm.idnumber'></label>
  <label>مدرک خود را انتخاب کنید:</label>

    <label>دیپلم<input type='checkbox' [formField]='signupForm.liscense'></label>
    <label>کارشناسی<input type='checkbox' [formField]='signupForm.liscense'></label>
    <label>کارشناسی ارشد<input type='checkbox' [formField]='signupForm.liscense'></label>

  <button>ثبت نام</button>
</form>
